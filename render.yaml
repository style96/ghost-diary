# Publish only the fictional recorded demo. Local Ollama and Windows speech
# remain on the user's device; this service has no runtime API credentials.
services:
  - type: web
    name: ghost-diary
    runtime: static
    repo: https://github.com/style96/ghost-diary
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm test && npm run build:demo
    staticPublishPath: ./out
    envVars:
      - key: NODE_VERSION
        value: "24"
